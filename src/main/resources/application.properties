spring.application.name=ticket-platform

## Spring DATASOURCE
spring.datasource.url = jdbc:mysql://localhost:3306/ticket_platform
spring.datasource.username = root
spring.datasource.password = root

# Hibernate ddl auto (create, create-drop, validate, update, none)
spring.jpa.hibernate.ddl-auto = create

# Mostrami sottoforma di query tutte le operazioni che facciamo sul db
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Serve a formattare correttamente i dati nei form
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.mvc.format.time=HH:mm:ss

