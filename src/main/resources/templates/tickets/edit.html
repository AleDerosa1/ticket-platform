<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets Platform</title>

    <th:block th:replace="~{ fragments/head :: head }"></th:block>

</head>

<body>

    <header>
        <nav th:replace="~{ fragments/navbar :: navbar }"></nav>
    </header>

    <main class="container">
        <section class="upper row">
            <div class="col-12 text-center">
                <h1 class="fw-bold">
                    Tickets updating page
                </h1>
            </div>
        </section class="tickets-content">
        <div class="col-12">
            <h2 class="text-center mb-3">
                You are updating a new game
            </h2>
        </div>

        <div class="col-12">
            <form th:action="@{/tickets/{id}(id=${ticket.id})}" method="POST" th:object="${ticket}">
                <div class="mb-3">
                    <label for="title" class="form-label">Title:</label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" th:errorClass="is-invalid"
                        required>

                    <div th:if="${#fields.hasErrors('title')}" class="invalid-feedback">
                        <ul>
                            <li th:each="error : ${#fields.errors('title')}" th:text="${error}"></li>
                        </ul>
                    </div>
                </div>

                 <div class="mb-3">
                        <button class="btn btn-primary" type="submit">Add new game</button>
                        <button class="btn btn-warning" type="reset">Reset fields</button>
                    </div>
            </form>
        </div>


        <section>

        </section>






        <footer th:replace="~{fragments/footer :: footer}">
        </footer>

</body>

</html>
